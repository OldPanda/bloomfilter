name: Build

on: [push, pull_request]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  compatibility:
    name: Go 1.16 source compatibility
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup compatibility toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.16.15'
      - name: Test source compatibility
        run: go test -race ./...

  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go: ['1.26.9', '1.27.2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Verify modules
        run: go mod verify
      - name: Test
        run: go test -race -coverpkg=./... -coverprofile=coverage.txt ./...
      - name: Preserve coverage for upload
        if: matrix.go == '1.27.2' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master'))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.txt
          if-no-files-found: error
          retention-days: 1

  coverage:
    needs: build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          version: v11.3.1
          files: coverage.txt
          override_pr: ${{ github.event.pull_request.number }}
          disable_search: true
          skip_validation: false
          fail_ci_if_error: true

  coverage-fork:
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
      - name: Upload fork coverage without credentials
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: false
          version: v11.3.1
          files: coverage.txt
          override_pr: ${{ github.event.pull_request.number }}
          disable_search: true
          skip_validation: false
          fail_ci_if_error: true
